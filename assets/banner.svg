<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Dark Tech Canvas Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="40%" stop-color="#0f172a" />
      <stop offset="75%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="35%" stop-color="#38bdf8" />
      <stop offset="70%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Radial ambient glows for background -->
    <radialGradient id="ambientCyan" cx="15%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="ambientPurple" cx="85%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.30" />
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="ambientCenter" cx="50%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0" />
    </radialGradient>

    <!-- Filters for Glow and Shadows -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="laserGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="techGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.25" />
      <circle cx="40" cy="40" r="1" fill="#38bdf8" fill-opacity="0.3" />
    </pattern>

    <style>
      @keyframes waveFlow {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -1200; }
      }
      @keyframes waveFlowRev {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: 1200; }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.75; transform: scale(1.05); }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-7px); }
      }
      @keyframes floatAlt {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(6px); }
      }
      @keyframes orbitParticle {
        0% { transform: rotate(0deg) translateX(30px) rotate(0deg); }
        100% { transform: rotate(360deg) translateX(30px) rotate(-360deg); }
      }
      @keyframes scanBeam {
        0% { transform: translateX(-400px); opacity: 0; }
        50% { opacity: 0.6; }
        100% { transform: translateX(1600px); opacity: 0; }
      }

      .animated-wave-1 {
        stroke-dasharray: 18 12;
        animation: waveFlow 30s linear infinite;
      }
      .animated-wave-2 {
        stroke-dasharray: 24 16;
        animation: waveFlowRev 25s linear infinite;
      }
      .animated-wave-3 {
        stroke-dasharray: 30 20;
        animation: waveFlow 20s linear infinite;
      }
      .pulsing-orb-1 {
        transform-origin: 180px 120px;
        animation: pulseGlow 6s ease-in-out infinite;
      }
      .pulsing-orb-2 {
        transform-origin: 1040px 300px;
        animation: pulseGlow 7s ease-in-out infinite 1.5s;
      }
      .floating-tag-left {
        animation: floatSlow 5s ease-in-out infinite;
      }
      .floating-tag-right {
        animation: floatAlt 5.5s ease-in-out infinite 0.7s;
      }
      .scanline {
        animation: scanBeam 8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
    </style>
  </defs>

  <!-- 1. Background Fill -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />

  <!-- 2. Ambient Color Blobs (Dynamic Animated Pulses) -->
  <circle class="pulsing-orb-1" cx="180" cy="120" r="280" fill="url(#ambientCyan)" />
  <circle class="pulsing-orb-2" cx="1040" cy="300" r="320" fill="url(#ambientPurple)" />
  <rect x="0" y="0" width="1200" height="420" fill="url(#ambientCenter)" />

  <!-- 3. Tech Matrix Grid Overlay -->
  <rect width="1200" height="420" fill="url(#techGrid)" />

  <!-- 4. Dynamic Geometric Flow Lines (Background Waves) -->
  <g opacity="0.65" filter="url(#laserGlow)">
    <!-- Wave 1: Flowing Cyan/Sky -->
    <path class="animated-wave-1" d="M -100 350 C 200 410, 450 260, 750 320 C 950 360, 1100 290, 1300 330" fill="none" stroke="#0ea5e9" stroke-width="2.5" />
    
    <!-- Wave 2: Flowing Indigo/Violet -->
    <path class="animated-wave-2" d="M -100 380 C 180 290, 480 390, 800 270 C 1000 190, 1150 260, 1300 240" fill="none" stroke="#8b5cf6" stroke-width="2" />

    <!-- Wave 3: Flowing Neon Magenta/Cyan Accent -->
    <path class="animated-wave-3" d="M -100 80 C 250 140, 500 40, 820 100 C 1020 140, 1150 70, 1300 110" fill="none" stroke="#06b6d4" stroke-width="1.8" opacity="0.4" />
  </g>

  <!-- Dynamic Scanning Beam Accent -->
  <rect class="scanline" x="0" y="0" width="300" height="420" fill="url(#neonGlow)" opacity="0.08" transform="skewX(-25)" />

  <!-- Outer Neon Frame Border with Rounded Edges -->
  <rect x="2" y="2" width="1196" height="416" rx="16" fill="none" stroke="url(#neonGlow)" stroke-width="1.8" stroke-opacity="0.45" />

  <!-- 5. Floating Visual Tech Nodes / Data Badges (Framing the Canvas) -->
  <!-- Left Side Pill: Super Resolution -->
  <g class="floating-tag-left" transform="translate(65, 80)">
    <rect width="170" height="38" rx="19" fill="#0f172a" fill-opacity="0.85" stroke="#0284c7" stroke-width="1.2" filter="url(#cardShadow)" />
    <circle cx="22" cy="19" r="6" fill="#38bdf8" />
    <circle cx="22" cy="19" r="11" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3 3" opacity="0.7" />
    <text x="38" y="24" fill="#e0f2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">SUPER-RESOLUTION</text>
  </g>

  <!-- Left Side Pill: Frame Interpolation -->
  <g class="floating-tag-left" transform="translate(45, 305)">
    <rect width="185" height="38" rx="19" fill="#0f172a" fill-opacity="0.85" stroke="#6366f1" stroke-width="1.2" filter="url(#cardShadow)" />
    <circle cx="22" cy="19" r="6" fill="#818cf8" />
    <text x="38" y="24" fill="#e0e7ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">FRAME INTERPOLATION</text>
  </g>

  <!-- Right Side Pill: Video Restoration -->
  <g class="floating-tag-right" transform="translate(965, 80)">
    <rect width="175" height="38" rx="19" fill="#0f172a" fill-opacity="0.85" stroke="#8b5cf6" stroke-width="1.2" filter="url(#cardShadow)" />
    <circle cx="22" cy="19" r="6" fill="#c084fc" />
    <text x="38" y="24" fill="#fae8ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">VIDEO RESTORATION</text>
  </g>

  <!-- Right Side Pill: Real-Time Streaming -->
  <g class="floating-tag-right" transform="translate(980, 305)">
    <rect width="165" height="38" rx="19" fill="#0f172a" fill-opacity="0.85" stroke="#ec4899" stroke-width="1.2" filter="url(#cardShadow)" />
    <circle cx="22" cy="19" r="6" fill="#f472b6" />
    <text x="38" y="24" fill="#fdf2f8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">REAL-TIME STREAMING</text>
  </g>

  <!-- 6. FOREGROUND CONTENT: Header, Title, Subtitle & Specs (High Contrast & Clear Readability) -->
  <g transform="translate(600, 0)" text-anchor="middle">
    
    <!-- Top Pill: Curated Ecosystem Badge -->
    <g transform="translate(0, 68)">
      <rect x="-160" y="-15" width="320" height="30" rx="15" fill="#1e1b4b" fill-opacity="0.8" stroke="#818cf8" stroke-width="1.2" />
      <text x="0" y="5" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" letter-spacing="2">⚡ THE DEFINITIVE AI VIDEO DIRECTORY</text>
    </g>

    <!-- Main Title with Distinct Drop Shadow for Absolute Foreground Legibility -->
    <text x="0" y="162" fill="#000000" opacity="0.6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="52" font-weight="900" letter-spacing="-1">Awesome AI Video Enhancement</text>
    <text x="0" y="158" fill="url(#titleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="52" font-weight="900" letter-spacing="-1" filter="url(#softGlow)">Awesome AI Video Enhancement</text>
    <text x="0" y="158" fill="url(#titleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="52" font-weight="900" letter-spacing="-1">Awesome AI Video Enhancement</text>

    <!-- Subtitle (Clean, High Contrast, Fully Foreground) -->
    <text x="0" y="210" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="500" letter-spacing="0.3">
      Curated Ecosystem of Commercial SaaS Platforms &amp; Open-Source Deep Learning Pipelines
    </text>

    <!-- Micro Descriptions / Capabilities Line -->
    <text x="0" y="244" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" letter-spacing="0.4">
      Super-Resolution (VSR) • Temporal Consistency • Artifact Removal • Motion Interpolation (VFI) • Real-Time Diffusion
    </text>

    <!-- Interactive / Status Metrics Bar in Foreground -->
    <g transform="translate(0, 312)">
      <!-- Box 1: SaaS Leaders -->
      <g transform="translate(-230, 0)">
        <rect x="-85" y="-22" width="170" height="44" rx="10" fill="#0f172a" fill-opacity="0.9" stroke="#334155" stroke-width="1.2" />
        <text x="0" y="-3" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="800">10+ SaaS</text>
        <text x="0" y="14" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" letter-spacing="0.5">COMMERCIAL TOOLS</text>
      </g>

      <!-- Box 2: Open Source Stars -->
      <g transform="translate(0, 0)">
        <rect x="-85" y="-22" width="170" height="44" rx="10" fill="#0f172a" fill-opacity="0.9" stroke="#334155" stroke-width="1.2" />
        <text x="0" y="-3" fill="#a855f7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="800">200K+ ⭐</text>
        <text x="0" y="14" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" letter-spacing="0.5">OPEN-SOURCE STARS</text>
      </g>

      <!-- Box 3: Verification & Updates -->
      <g transform="translate(230, 0)">
        <rect x="-85" y="-22" width="170" height="44" rx="10" fill="#0f172a" fill-opacity="0.9" stroke="#334155" stroke-width="1.2" />
        <text x="0" y="-3" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="800">100% Active</text>
        <text x="0" y="14" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" letter-spacing="0.5">CURATED &amp; TESTED</text>
      </g>
    </g>
  </g>
</svg>
